<!DOCTYPE html>
<html lang="pt-BR" data-api-base="" data-server-only="true">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c8102e" />
    <title>Oração Ininterrupta · Igreja Cristã Maranata</title>
    <link rel="icon" href="logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
      <div class="orb orb-c"></div>
    </div>

    <div class="shell">
      <header class="hero">
        <div class="logo-wrap">
          <img class="brand" src="logo.svg" alt="Igreja Cristã Maranata" />
        </div>
        <h1 class="hero-title">Oração Ininterrupta</h1>
        <p class="hero-sub">Organize e compartilhe a escala de oração da sua igreja</p>
      </header>

      <form id="form" class="glass delay-1" hidden>
        <div class="field">
          <label for="igreja"><i class="bi bi-building"></i> Igreja</label>
          <input id="igreja" type="text" maxlength="39" placeholder="Ex.: ICM Bom Pastor" required />
        </div>
        <div class="field">
          <label for="motivo"><i class="bi bi-heart"></i> Motivo</label>
          <input id="motivo" type="text" maxlength="39" placeholder="Oração Ininterrupta" required />
        </div>
        <div class="field">
          <label><i class="bi bi-calendar-range"></i> Período (primeiro e último dia)</label>
          <div class="dates">
            <input id="date0" type="date" required aria-label="Primeiro dia" />
            <input id="date1" type="date" required aria-label="Último dia" />
          </div>
        </div>
        <div class="form-actions">
          <button class="btn ghost" type="button" id="cancelBtn">Cancelar</button>
          <button class="btn" type="submit" id="okBtn"><i class="bi bi-check2"></i> Criar escala</button>
        </div>
      </form>

      <section class="glass delay-2">
        <div class="section-head">
          <h2><i class="bi bi-journal-text"></i> Escalas</h2>
          <button class="btn sm" type="button" id="newBtn">
            <i class="bi bi-plus-lg"></i> Nova
          </button>
        </div>
        <div id="lists"></div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="app.js?v=5"></script>
    <script>
      const form = document.getElementById("form");
      const newBtn = document.getElementById("newBtn");
      const lists = document.getElementById("lists");

      document.getElementById("date0").value = ICM.localToday(0);
      document.getElementById("date1").value = ICM.localToday(6);
      document.getElementById("motivo").value = "Oração Ininterrupta";

      newBtn.addEventListener("click", () => {
        const open = form.hidden;
        form.hidden = !open;
        newBtn.innerHTML = open
          ? '<i class="bi bi-x-lg"></i> Fechar'
          : '<i class="bi bi-plus-lg"></i> Nova';
        if (open) document.getElementById("igreja").focus();
      });

      document.getElementById("cancelBtn").addEventListener("click", () => {
        form.hidden = true;
        newBtn.innerHTML = '<i class="bi bi-plus-lg"></i> Nova';
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const igreja = document.getElementById("igreja").value.trim();
        const motivo = document.getElementById("motivo").value.trim();
        const date0 = document.getElementById("date0").value;
        const date1 = document.getElementById("date1").value;

        if (!igreja || !motivo || !date0 || !date1) {
          Swal.fire({
            title: "Campos incompletos",
            text: "Preencha igreja, motivo e período.",
            icon: "error",
            customClass: ICM.swalButtons(),
          });
          return;
        }

        if (date1 < date0) {
          Swal.fire({
            title: "Período inválido",
            text: "O último dia não pode ser antes do primeiro.",
            icon: "error",
            customClass: ICM.swalButtons(),
          });
          return;
        }

        const okBtn = document.getElementById("okBtn");
        okBtn.disabled = true;
        Swal.fire({
          title: "Aguarde...",
          allowOutsideClick: false,
          didOpen: () => Swal.showLoading(),
        });

        try {
          const record = await ICM.createScale({ igreja, motivo, date0, date1 });
          window.location.href = ICM.scaleHref(record.id);
        } catch (err) {
          Swal.fire({
            title: "Erro",
            text:
              err && err.message === "api_off"
                ? "Sem conexão com o servidor. Verifique a internet e tente de novo. A escala precisa ficar online para todo o grupo ver."
                : "Não foi possível criar a escala no servidor. Tente de novo.",
            icon: "error",
            customClass: ICM.swalButtons(),
          });
          okBtn.disabled = false;
        }
      });

      async function renderList() {
        lists.replaceChildren();
        lists.innerHTML = '<p class="muted" style="text-align:center;padding:1rem">Carregando...</p>';
        const { items, synced, apiOff } = await ICM.listScales();
        lists.replaceChildren();
        if (apiOff) {
          const warn = document.createElement("p");
          warn.className = "flash err";
          warn.style.marginBottom = "1rem";
          warn.textContent =
            "Servidor indisponível. As escalas só aparecem quando o site está online (para todo o grupo).";
          lists.before(warn);
        }
        if (synced > 0) {
          const note = document.createElement("p");
          note.className = "flash ok";
          note.style.marginBottom = "1rem";
          note.textContent =
            synced === 1
              ? "1 escala foi enviada ao servidor. Já aparece no painel admin."
              : `${synced} escalas foram enviadas ao servidor. Já aparecem no painel admin.`;
          lists.before(note);
        }
        if (!items.length) {
          const box = document.createElement("div");
          box.className = "empty";
          box.innerHTML =
            '<div class="empty-icon"><i class="bi bi-calendar-plus"></i></div>' +
            "<h3>Nenhuma escala ainda</h3>" +
            "<p>Toque em <strong>Nova</strong> para criar a primeira.</p>";
          lists.append(box);
          return;
        }

        for (const item of items) {
          const link = document.createElement("a");
          link.className = "scale-card";
          link.href = ICM.scaleHref(item.id);
          link.innerHTML =
            '<span class="scale-card-icon"><i class="bi bi-moon-stars"></i></span>' +
            `<span class="scale-card-body"><b>${escapeHtml(item.motivo)}</b>` +
            `<small>${escapeHtml(item.igreja)} · ${ICM.brDate(item.date0)} – ${ICM.brDate(item.date1)}</small></span>` +
            '<span class="scale-card-arrow"><i class="bi bi-chevron-right"></i></span>';
          lists.append(link);
        }
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      renderList();
    </script>
  </body>
</html>
