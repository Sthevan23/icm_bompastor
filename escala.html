<!DOCTYPE html>
<html lang="pt-BR" data-api-base="" data-server-only="true">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c8102e" />
    <title>Escala · Oração Ininterrupta</title>
    <link rel="icon" href="logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=3" />
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
      <div class="orb orb-c"></div>
    </div>

    <div class="shell shell-escala">
      <header class="topbar">
        <button class="icon-btn" type="button" id="backBtn" aria-label="Voltar">
          <i class="bi bi-arrow-left"></i>
        </button>
        <h1>Escala de oração</h1>
        <span></span>
      </header>

      <div class="logo-inline">
        <img class="brand" src="logo.svg" alt="Igreja Cristã Maranata" />
      </div>

      <section class="glass delay-1" id="info">
        <div class="info-grid">
          <div class="info-item">
            <span class="k">Igreja</span>
            <span class="v" id="igreja">—</span>
          </div>
          <div class="info-item">
            <span class="k">Motivo</span>
            <span class="v" id="motivo">—</span>
          </div>
          <div class="info-item">
            <span class="k">Período</span>
            <span class="v" id="periodo">—</span>
          </div>
        </div>
      </section>

      <div class="actions actions-compact delay-2">
        <div class="action-item">
          <button id="copyButton" type="button" disabled aria-label="Copiar link">
            <i class="bi bi-whatsapp"></i>
          </button>
          <span id="optLabel-1">Compartilhar</span>
        </div>
        <div class="action-item">
          <button id="downloadButton" type="button" disabled aria-label="Baixar PDF">
            <i class="bi bi-file-earmark-pdf"></i>
          </button>
          <span id="optLabel-2">PDF</span>
        </div>
      </div>

      <p class="hint hint-elder" id="slotHint" hidden>
        <i class="bi bi-info-circle" aria-hidden="true"></i>
        <span
          >Toque em <strong>Escolher este horário</strong> na linha certa. Cada horário dura
          <strong>15 minutos</strong> — veja <strong>início</strong> e <strong>fim</strong> em
          letras grandes.</span
        >
      </p>

      <nav class="slot-jump" id="slotJump" aria-label="Ir para parte do dia" hidden></nav>

      <div class="slot-list" id="slotList">
        <div class="loading-row">Buscando a lista...</div>
      </div>
    </div>

    <div id="pdfSheet" class="pdf-sheet" aria-hidden="true">
      <img src="logo.svg" alt="Igreja Cristã Maranata" />
      <h2>Escala da Oração Ininterrupta</h2>
      <p class="pdf-meta" id="pdfMeta"></p>
      <div class="pdf-cols">
        <table>
          <thead>
            <tr>
              <th>Horário</th>
              <th>Nome</th>
            </tr>
          </thead>
          <tbody id="pdfLeft"></tbody>
        </table>
        <table>
          <thead>
            <tr>
              <th>Horário</th>
              <th>Nome</th>
            </tr>
          </thead>
          <tbody id="pdfRight"></tbody>
        </table>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="app.js?v=6"></script>
    <script>
      const id = ICM.parseScaleId();
      if (id) ICM.canonicalizeScaleUrl(id);
      let state = null;
      let owner = false;

      document.getElementById("backBtn").addEventListener("click", () => {
        window.location.href = "index.html";
      });

      function buttons() {
        return { customClass: ICM.swalButtons() };
      }

      function openLoading(message) {
        Swal.fire({
          title: message,
          allowOutsideClick: false,
          didOpen: () => Swal.showLoading(),
        });
      }

      const DAY_PARTS = [
        {
          id: "madrugada",
          label: "Madrugada",
          hint: "0h às 6h",
          icon: "bi-moon-stars-fill",
          fromMin: 0,
          toMin: 360,
        },
        {
          id: "manha",
          label: "Manhã",
          hint: "6h às 12h",
          icon: "bi-sunrise-fill",
          fromMin: 360,
          toMin: 720,
        },
        {
          id: "tarde",
          label: "Tarde",
          hint: "12h às 18h",
          icon: "bi-sun-fill",
          fromMin: 720,
          toMin: 1080,
        },
        {
          id: "noite",
          label: "Noite",
          hint: "18h às 24h",
          icon: "bi-moon-fill",
          fromMin: 1080,
          toMin: 1440,
        },
      ];

      function parseIntervalKey(key) {
        const m = String(key).match(/^(\d{2}:\d{2})\s*às\s*(\d{2}:\d{2})$/);
        return m ? { start: m[1], end: m[2] } : { start: "—", end: "—" };
      }

      function minutesFromClock(clock) {
        const [h, min] = String(clock).split(":").map((n) => parseInt(n, 10));
        if (Number.isNaN(h) || Number.isNaN(min)) return 0;
        return h * 60 + min;
      }

      function dayPartForInterval(interval) {
        const { start } = parseIntervalKey(interval);
        const mins = minutesFromClock(start);
        return (
          DAY_PARTS.find((p) => mins >= p.fromMin && mins < p.toMin) ||
          DAY_PARTS[DAY_PARTS.length - 1]
        );
      }

      function friendlyInterval(interval) {
        const { start, end } = parseIntervalKey(interval);
        return `Das ${start} até ${end}`;
      }

      function buildSlotJump() {
        const nav = document.getElementById("slotJump");
        nav.replaceChildren();
        for (const part of DAY_PARTS) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "slot-jump-btn";
          btn.innerHTML = `<i class="bi ${part.icon}"></i><span>${part.label}</span>`;
          btn.addEventListener("click", () => {
            const target = document.getElementById(`part-${part.id}`);
            target?.scrollIntoView({ behavior: "smooth", block: "start" });
          });
          nav.append(btn);
        }
        nav.hidden = false;
      }

      function appendSlotRow(list, interval, name, animIndex) {
        const row = document.createElement("div");
        row.className = "slot-row";
        if (animIndex < 8) row.style.animationDelay = `${animIndex * 0.03}s`;

        const { start, end } = parseIntervalKey(interval);
        const time = document.createElement("div");
        time.className = "slot-time-block";
        time.innerHTML =
          `<p class="slot-time-line"><span class="slot-k">Início</span> <strong class="slot-h">${start}</strong></p>` +
          `<p class="slot-time-line"><span class="slot-k">Fim</span> <strong class="slot-h">${end}</strong></p>` +
          `<p class="slot-time-dur">15 minutos de oração</p>`;

        const whoWrap = document.createElement("div");
        whoWrap.className = "slot-who";

        if (name && ICM.canEditSlot(id, interval, name)) {
          row.classList.add("filled", "mine");
          const own = document.createElement("div");
          own.className = "slot-own";
          const label = document.createElement("p");
          label.className = "slot-status slot-status-mine";
          label.textContent = `Seu horário: ${name}`;
          const editBtn = document.createElement("button");
          editBtn.type = "button";
          editBtn.className = "registerLink registerLink-lg";
          editBtn.textContent = "Alterar meu nome";
          editBtn.addEventListener("click", () => editRegister(interval, name));
          own.append(label, editBtn);
          whoWrap.append(own);
        } else if (name) {
          row.classList.add("filled", "taken");
          const label = document.createElement("p");
          label.className = "slot-status slot-status-taken";
          label.innerHTML = `<span class="slot-k">Ocupado</span> <strong>${escapeHtml(name)}</strong>`;
          whoWrap.append(label);
        } else {
          row.classList.add("free");
          const button = document.createElement("button");
          button.type = "button";
          button.className = "registerLink registerLink-lg";
          button.textContent = "Escolher este horário";
          button.setAttribute("aria-label", `${friendlyInterval(interval)} — escolher`);
          button.addEventListener("click", () => register(interval));
          whoWrap.append(button);
        }

        row.append(time, whoWrap);
        list.append(row);
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      function render() {
        document.getElementById("igreja").textContent = state.igreja;
        document.getElementById("motivo").textContent = state.motivo;
        document.getElementById("periodo").textContent =
          `${ICM.brDate(state.date0)} – ${ICM.brDate(state.date1)}`;

        document.getElementById("slotHint").hidden = false;
        buildSlotJump();

        const list = document.getElementById("slotList");
        list.replaceChildren();

        const intervals = Object.keys(state.currentList);
        let anim = 0;
        let currentPartId = null;

        for (const interval of intervals) {
          const part = dayPartForInterval(interval);
          if (part.id !== currentPartId) {
            currentPartId = part.id;
            const head = document.createElement("div");
            head.className = "slot-part";
            head.id = `part-${part.id}`;
            head.innerHTML =
              `<div class="slot-part-icon"><i class="bi ${part.icon}"></i></div>` +
              `<div class="slot-part-text"><strong>${part.label}</strong><span>${part.hint}</span></div>`;
            list.append(head);
          }
          appendSlotRow(list, interval, state.currentList[interval], anim);
          anim += 1;
        }
      }

      function enableActions() {
        document.getElementById("copyButton").disabled = false;
        document.getElementById("downloadButton").disabled = !owner;
        document.getElementById("optLabel-1").classList.add("on");
        if (owner) {
          document.getElementById("optLabel-2").classList.add("on");
        }
      }

      async function register(interval) {
        const result = await Swal.fire({
          title: friendlyInterval(interval),
          text: "Escreva seu nome completo ou como a igreja te conhece.",
          input: "text",
          inputAttributes: { placeholder: "Seu nome", maxlength: "32" },
          showCancelButton: true,
          reverseButtons: true,
          cancelButtonText: "Cancelar",
          confirmButtonText: "Confirmar",
          customClass: ICM.swalButtons(),
          inputValidator: (value) => {
            if (value.trim() === "") return "O nome não pode ser vazio";
            if (value.trim().length > 32) return "Máximo de 32 caracteres";
            return undefined;
          },
        });
        if (!result.value) return;
        await registerCb(result.value.trim(), interval);
      }

      async function registerCb(name, interval) {
        openLoading("Aguarde...");
        const result = await ICM.setSlot(id, interval, name);
        Swal.close();

        if (result.data && result.data.record) state = result.data.record;
        else if (result.data && result.data.currentList) state = result.data;

        if (!result.ok) {
          const text =
            result.status === 409
              ? `O horário ${interval} já foi preenchido.`
              : "Não foi possível concluir. Tente novamente.";
          await Swal.fire({
            title: "Horário indisponível",
            text,
            icon: "warning",
            ...buttons(),
          });
        } else {
          ICM.rememberSlotClaim(id, interval, name);
          await Swal.fire({
            title: "Registrado!",
            text: "Sua participação foi salva com sucesso.",
            icon: "success",
            timer: 1800,
            showConfirmButton: false,
          });
          if (owner) ICM.remember(state);
        }
        if (state) render();
      }

      async function editRegister(interval, currentName) {
        const result = await Swal.fire({
          title: friendlyInterval(interval),
          text: "Altere seu nome ou toque em Sair do horário",
          input: "text",
          inputValue: currentName,
          inputAttributes: { placeholder: "Seu nome", maxlength: "32" },
          showCancelButton: true,
          showDenyButton: true,
          reverseButtons: true,
          cancelButtonText: "Cancelar",
          denyButtonText: "Sair do horário",
          confirmButtonText: "Salvar",
          customClass: ICM.swalButtons(),
          inputValidator: (value) => {
            if (value.trim() === "") return "O nome não pode ser vazio";
            if (value.trim().length > 32) return "Máximo de 32 caracteres";
            return undefined;
          },
        });

        if (result.isDenied) {
          openLoading("Aguarde...");
          const response = await ICM.setSlot(id, interval, null, { previousName: currentName });
          Swal.close();
          if (response.data?.record) state = response.data.record;
          else if (response.data?.currentList) state = response.data;
          if (!response.ok) {
            await Swal.fire({
              title: "Erro",
              text: "Só é possível sair do horário que você registrou neste aparelho.",
              icon: "warning",
              ...buttons(),
            });
          } else {
            ICM.forgetSlotClaim(id, interval);
          }
          if (state) render();
          return;
        }

        if (!result.value) return;
        const newName = result.value.trim();
        if (normName(newName) === normName(currentName)) return;

        openLoading("Aguarde...");
        const response = await ICM.setSlot(id, interval, newName, { previousName: currentName });
        Swal.close();
        if (response.data?.record) state = response.data.record;
        else if (response.data?.currentList) state = response.data;

        if (!response.ok) {
          await Swal.fire({
            title: "Não foi possível alterar",
            text:
              response.status === 403
                ? "Só você pode editar o horário que registrou neste aparelho."
                : "Este horário já foi preenchido por outra pessoa.",
            icon: "warning",
            ...buttons(),
          });
        } else {
          ICM.rememberSlotClaim(id, interval, newName);
          await Swal.fire({
            title: "Atualizado!",
            icon: "success",
            timer: 1400,
            showConfirmButton: false,
          });
        }
        if (state) render();
      }

      function normName(value) {
        return String(value || "")
          .trim()
          .toLocaleLowerCase("pt-BR");
      }

      function messageText() {
        return `📜 *ESCALA DA ORAÇÃO ININTERRUPTA*

_Igreja: ${state.igreja}_
_Motivo: ${state.motivo}_
_Período: ${ICM.brDate(state.date0)} – ${ICM.brDate(state.date1)}_

Para participar, acesse:
${ICM.scaleShareUrl(id)}`;
      }

      document.getElementById("copyButton").addEventListener("click", async () => {
        if (!state) return;
        openLoading("Verificando link...");
        let ok = false;
        try {
          const check = await ICM.getScale(id);
          ok = Boolean(check);
        } catch {
          ok = false;
        }
        Swal.close();
        if (!ok) {
          await Swal.fire({
            title: "Ainda não está online",
            text: "Esta escala não está salva no servidor. Crie de novo pelo botão Nova na página inicial (com internet) e compartilhe outra vez.",
            icon: "warning",
            ...buttons(),
          });
          return;
        }
        const text = messageText();
        try {
          await navigator.clipboard.writeText(text);
          Swal.fire({
            title: "Copiado!",
            text: "Cole no WhatsApp e envie para a igreja.",
            icon: "success",
            timer: 1600,
            showConfirmButton: false,
          });
        } catch {
          Swal.fire({
            title: "Copie a mensagem",
            input: "textarea",
            inputValue: text,
            confirmButtonText: "Fechar",
            customClass: ICM.swalButtons(),
          });
        }
      });

      function fillPdfColumn(target, rows) {
        target.replaceChildren();
        for (const [interval, name] of rows) {
          const row = document.createElement("tr");
          const time = document.createElement("td");
          time.textContent = interval;
          const who = document.createElement("td");
          who.textContent = name || "";
          row.append(time, who);
          target.append(row);
        }
      }

      document.getElementById("downloadButton").addEventListener("click", async () => {
        if (!owner || !state || typeof html2pdf === "undefined") return;
        const entries = Object.entries(state.currentList);
        fillPdfColumn(document.getElementById("pdfLeft"), entries.slice(0, 48));
        fillPdfColumn(document.getElementById("pdfRight"), entries.slice(48));
        document.getElementById("pdfMeta").textContent =
          `Igreja: ${state.igreja}\nMotivo: ${state.motivo}\nPeríodo: ${ICM.brDate(state.date0)} – ${ICM.brDate(state.date1)}`;

        const sheet = document.getElementById("pdfSheet");
        openLoading("Gerando PDF...");
        try {
          await html2pdf()
            .set({
              margin: [8, 8, 8, 8],
              filename: "escala-oracao-ininterrupta.pdf",
              image: { type: "jpeg", quality: 0.98 },
              html2canvas: { scale: 2, useCORS: true, scrollX: 0, scrollY: 0 },
              jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
              pagebreak: { mode: ["css", "legacy"] },
            })
            .from(sheet)
            .save();
        } catch {
          await Swal.fire({
            title: "Erro no PDF",
            text: "Não foi possível gerar o arquivo.",
            icon: "warning",
            ...buttons(),
          });
        } finally {
          Swal.close();
        }
      });

      async function main() {
        if (!id) {
          window.location.href = "index.html";
          return;
        }
        try {
          const data = await ICM.getScale(id);
          if (!data) {
            ICM.forget(id);
            await Swal.fire({
              title: "Escala não encontrada",
              html:
                "Este link <strong>não está no servidor</strong> (comum com links antigos ou só do seu celular).<br><br>" +
                "Peça quem administra para criar de novo em <strong>Nova escala</strong> no site e enviar o link do botão <strong>Compartilhar</strong>.",
              icon: "warning",
              confirmButtonText: "Ir para o início",
              ...buttons(),
            });
            window.location.href = "index.html";
            return;
          }
          state = data;
          owner = ICM.isOwner(id);
          render();
          enableActions();
        } catch (err) {
          document.getElementById("slotList").innerHTML =
            '<div class="loading-row">Não foi possível carregar. Tente de novo ou crie uma nova escala no início.</div>';
          Swal.fire({
            title: "Erro",
            text:
              err && err.message === "api_off"
                ? "Sem conexão com o servidor. Os horários são salvos online para todo o grupo — verifique a internet."
                : "Não foi possível carregar a escala. Use o link Compartilhar de uma escala criada no site online.",
            icon: "error",
            ...buttons(),
          });
        }
      }

      main();
    </script>
  </body>
</html>
