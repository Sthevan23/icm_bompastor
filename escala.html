<!DOCTYPE html>
<html lang="pt-BR" data-api-base="" data-server-only="true">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c8102e" />
    <title>Escala · Oração Ininterrupta</title>
    <link rel="icon" href="logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=6" />
  </head>
  <body class="page-escala">
    <div class="bg" aria-hidden="true">
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
      <div class="orb orb-c"></div>
    </div>

    <div class="shell shell-escala">
      <header class="topbar">
        <button class="icon-btn" type="button" id="backBtn" aria-label="Voltar">
          <i class="bi bi-arrow-left"></i>
        </button>
        <h1>Escala de oração</h1>
        <span></span>
      </header>

      <div class="logo-inline">
        <img class="brand" src="logo.svg" alt="Igreja Cristã Maranata" />
      </div>

      <section class="glass delay-1" id="info">
        <div class="info-grid">
          <div class="info-item">
            <span class="k">Igreja</span>
            <span class="v" id="igreja">—</span>
          </div>
          <div class="info-item">
            <span class="k">Motivo</span>
            <span class="v" id="motivo">—</span>
          </div>
          <div class="info-item">
            <span class="k">Período</span>
            <span class="v" id="periodo">—</span>
          </div>
        </div>
      </section>

      <div class="actions actions-compact delay-2">
        <div class="action-item">
          <button id="copyButton" type="button" disabled aria-label="Compartilhar link da escala">
            <i class="bi bi-link-45deg"></i>
          </button>
          <span id="optLabel-1">Link</span>
        </div>
        <div class="action-item">
          <button id="whatsappListButton" type="button" disabled aria-label="Enviar lista no WhatsApp">
            <i class="bi bi-whatsapp"></i>
          </button>
          <span id="optLabel-2">Lista WhatsApp</span>
        </div>
        <div class="action-item">
          <button id="downloadButton" type="button" disabled aria-label="Baixar PDF">
            <i class="bi bi-file-earmark-pdf"></i>
          </button>
          <span id="optLabel-3">PDF</span>
        </div>
      </div>

      <div class="slot-list" id="slotList">
        <div class="loading-row">Buscando a lista...</div>
      </div>
    </div>

    <div id="pdfSheet" class="pdf-sheet" aria-hidden="true">
      <img src="logo.svg" alt="Igreja Cristã Maranata" />
      <h2>Escala da Oração Ininterrupta</h2>
      <p class="pdf-meta" id="pdfMeta"></p>
      <div class="pdf-cols">
        <table>
          <thead>
            <tr>
              <th>Horário</th>
              <th>Nome</th>
            </tr>
          </thead>
          <tbody id="pdfLeft"></tbody>
        </table>
        <table>
          <thead>
            <tr>
              <th>Horário</th>
              <th>Nome</th>
            </tr>
          </thead>
          <tbody id="pdfRight"></tbody>
        </table>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="app.js?v=6"></script>
    <script>
      const id = ICM.parseScaleId();
      if (id) ICM.canonicalizeScaleUrl(id);
      let state = null;
      let owner = false;

      document.getElementById("backBtn").addEventListener("click", () => {
        window.location.href = "index.html";
      });

      function buttons() {
        return { customClass: ICM.swalButtons() };
      }

      function openLoading(message) {
        Swal.fire({
          title: message,
          allowOutsideClick: false,
          didOpen: () => Swal.showLoading(),
        });
      }

      function render() {
        document.getElementById("igreja").textContent = state.igreja;
        document.getElementById("motivo").textContent = state.motivo;
        document.getElementById("periodo").textContent =
          `${ICM.brDate(state.date0)} – ${ICM.brDate(state.date1)}`;

        const list = document.getElementById("slotList");
        list.replaceChildren();

        let i = 0;
        for (const interval of Object.keys(state.currentList)) {
          const row = document.createElement("div");
          row.className = "slot-row";
          if (i < 12) row.style.animationDelay = `${i * 0.04}s`;
          i += 1;

          const time = document.createElement("div");
          time.className = "slot-time";
          time.innerHTML = `<i class="bi bi-clock"></i> ${interval}`;

          const whoWrap = document.createElement("div");
          whoWrap.className = "slot-who";
          const name = state.currentList[interval];

          if (name && ICM.canEditSlot(id, interval, name)) {
            row.classList.add("filled");
            const own = document.createElement("div");
            own.className = "slot-own";
            const span = document.createElement("span");
            span.className = "slot-name";
            span.textContent = name;
            const editBtn = document.createElement("button");
            editBtn.type = "button";
            editBtn.className = "registerLink";
            editBtn.textContent = "Editar";
            editBtn.addEventListener("click", () => editRegister(interval, name));
            own.append(span, editBtn);
            whoWrap.append(own);
          } else if (name) {
            row.classList.add("filled");
            const span = document.createElement("span");
            span.className = "slot-name";
            span.textContent = name;
            whoWrap.append(span);
          } else {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "registerLink";
            button.textContent = "Registrar";
            button.addEventListener("click", () => register(interval));
            whoWrap.append(button);
          }

          row.append(time, whoWrap);
          list.append(row);
        }
      }

      function enableActions() {
        document.getElementById("copyButton").disabled = false;
        document.getElementById("whatsappListButton").disabled = false;
        document.getElementById("downloadButton").disabled = false;
        document.getElementById("optLabel-1").classList.add("on");
        document.getElementById("optLabel-2").classList.add("on");
        document.getElementById("optLabel-3").classList.add("on");
      }

      async function ensureScaleOnline() {
        openLoading("Verificando...");
        let ok = false;
        try {
          const check = await ICM.getScale(id);
          ok = Boolean(check);
          if (check) state = check;
        } catch {
          ok = false;
        }
        Swal.close();
        if (!ok) {
          await Swal.fire({
            title: "Ainda não está online",
            text: "Esta escala não está salva no servidor. Crie de novo pelo botão Nova na página inicial (com internet).",
            icon: "warning",
            ...buttons(),
          });
        }
        return ok;
      }

      async function register(interval) {
        const result = await Swal.fire({
          title: interval,
          text: "Informe seu nome para este horário",
          input: "text",
          inputAttributes: { placeholder: "Seu nome", maxlength: "32" },
          showCancelButton: true,
          reverseButtons: true,
          cancelButtonText: "Cancelar",
          confirmButtonText: "Confirmar",
          customClass: ICM.swalButtons(),
          inputValidator: (value) => {
            if (value.trim() === "") return "O nome não pode ser vazio";
            if (value.trim().length > 32) return "Máximo de 32 caracteres";
            return undefined;
          },
        });
        if (!result.value) return;
        await registerCb(result.value.trim(), interval);
      }

      async function registerCb(name, interval) {
        openLoading("Aguarde...");
        const result = await ICM.setSlot(id, interval, name);
        Swal.close();

        if (result.data && result.data.record) state = result.data.record;
        else if (result.data && result.data.currentList) state = result.data;

        if (!result.ok) {
          const text =
            result.status === 409
              ? `O horário ${interval} já foi preenchido.`
              : "Não foi possível concluir. Tente novamente.";
          await Swal.fire({
            title: "Horário indisponível",
            text,
            icon: "warning",
            ...buttons(),
          });
        } else {
          ICM.rememberSlotClaim(id, interval, name);
          await Swal.fire({
            title: "Registrado!",
            text: "Sua participação foi salva com sucesso.",
            icon: "success",
            timer: 1800,
            showConfirmButton: false,
          });
          if (owner) ICM.remember(state);
        }
        if (state) render();
      }

      async function editRegister(interval, currentName) {
        const result = await Swal.fire({
          title: interval,
          text: "Altere seu nome ou saia deste horário",
          input: "text",
          inputValue: currentName,
          inputAttributes: { placeholder: "Seu nome", maxlength: "32" },
          showCancelButton: true,
          showDenyButton: true,
          reverseButtons: true,
          cancelButtonText: "Cancelar",
          denyButtonText: "Sair do horário",
          confirmButtonText: "Salvar",
          customClass: ICM.swalButtons(),
          inputValidator: (value) => {
            if (value.trim() === "") return "O nome não pode ser vazio";
            if (value.trim().length > 32) return "Máximo de 32 caracteres";
            return undefined;
          },
        });

        if (result.isDenied) {
          openLoading("Aguarde...");
          const response = await ICM.setSlot(id, interval, null, { previousName: currentName });
          Swal.close();
          if (response.data?.record) state = response.data.record;
          else if (response.data?.currentList) state = response.data;
          if (!response.ok) {
            await Swal.fire({
              title: "Erro",
              text: "Só é possível sair do horário que você registrou neste aparelho.",
              icon: "warning",
              ...buttons(),
            });
          } else {
            ICM.forgetSlotClaim(id, interval);
          }
          if (state) render();
          return;
        }

        if (!result.value) return;
        const newName = result.value.trim();
        if (normName(newName) === normName(currentName)) return;

        openLoading("Aguarde...");
        const response = await ICM.setSlot(id, interval, newName, { previousName: currentName });
        Swal.close();
        if (response.data?.record) state = response.data.record;
        else if (response.data?.currentList) state = response.data;

        if (!response.ok) {
          await Swal.fire({
            title: "Não foi possível alterar",
            text:
              response.status === 403
                ? "Só você pode editar o horário que registrou neste aparelho."
                : "Este horário já foi preenchido por outra pessoa.",
            icon: "warning",
            ...buttons(),
          });
        } else {
          ICM.rememberSlotClaim(id, interval, newName);
          await Swal.fire({
            title: "Atualizado!",
            icon: "success",
            timer: 1400,
            showConfirmButton: false,
          });
        }
        if (state) render();
      }

      function normName(value) {
        return String(value || "")
          .trim()
          .toLocaleLowerCase("pt-BR");
      }

      function messageLink() {
        return `*ESCALA DA ORAÇÃO ININTERRUPTA*

Igreja: ${state.igreja}
Motivo: ${state.motivo}
Período: ${ICM.brDate(state.date0)} – ${ICM.brDate(state.date1)}

Para participar, acesse:
${ICM.scaleShareUrl(id)}`;
      }

      function messageFilledList() {
        const blocks = [];
        for (const [interval, name] of Object.entries(state.currentList)) {
          if (name) blocks.push(`${interval}\n${name}`);
        }
        let text = `*ESCALA DA ORAÇÃO ININTERRUPTA*\n\n`;
        text += `Igreja: ${state.igreja}\n`;
        text += `Motivo: ${state.motivo}\n`;
        text += `Período: ${ICM.brDate(state.date0)} – ${ICM.brDate(state.date1)}\n\n`;
        if (blocks.length) {
          text += `*Horários:*\n\n${blocks.join("\n\n")}\n\n`;
        } else {
          text += `Nenhum horário preenchido ainda.\n\n`;
        }
        text += `Para se inscrever:\n${ICM.scaleShareUrl(id)}`;
        return text;
      }

      async function copyOrShowText(text, successHint) {
        try {
          await navigator.clipboard.writeText(text);
          Swal.fire({
            title: "Copiado!",
            text: successHint,
            icon: "success",
            timer: 1800,
            showConfirmButton: false,
          });
        } catch {
          Swal.fire({
            title: "Copie a mensagem",
            input: "textarea",
            inputValue: text,
            confirmButtonText: "Fechar",
            customClass: ICM.swalButtons(),
          });
        }
      }

      document.getElementById("copyButton").addEventListener("click", async () => {
        if (!state) return;
        if (!(await ensureScaleOnline())) return;
        await copyOrShowText(messageLink(), "Cole no WhatsApp e envie o link da escala.");
      });

      document.getElementById("whatsappListButton").addEventListener("click", async () => {
        if (!state) return;
        if (!(await ensureScaleOnline())) return;
        const text = messageFilledList();
        const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
        const opened = window.open(url, "_blank", "noopener,noreferrer");
        if (!opened) {
          await copyOrShowText(text, "Cole no WhatsApp — mensagem com os horários preenchidos.");
        }
      });

      function fillPdfColumn(target, rows) {
        target.replaceChildren();
        for (const [interval, name] of rows) {
          const row = document.createElement("tr");
          if (name) row.className = "pdf-filled";
          const time = document.createElement("td");
          time.textContent = interval;
          const who = document.createElement("td");
          who.textContent = name || "—";
          row.append(time, who);
          target.append(row);
        }
      }

      document.getElementById("downloadButton").addEventListener("click", async () => {
        if (!state || typeof html2pdf === "undefined") return;
        const entries = Object.entries(state.currentList);
        const stats = ICM.stats(state.currentList);
        fillPdfColumn(document.getElementById("pdfLeft"), entries.slice(0, 48));
        fillPdfColumn(document.getElementById("pdfRight"), entries.slice(48));

        const logo = document.querySelector("#pdfSheet img");
        logo.src = new URL("logo.svg", window.location.href).href;

        document.getElementById("pdfMeta").textContent =
          `Igreja: ${state.igreja}\n` +
          `Motivo: ${state.motivo}\n` +
          `Período: ${ICM.brDate(state.date0)} – ${ICM.brDate(state.date1)}\n` +
          `Preenchidos: ${stats.filled} de ${stats.total} (${stats.percentage}%)\n` +
          `Link: ${ICM.scaleShareUrl(id)}`;

        const sheet = document.getElementById("pdfSheet");
        const saved = {
          position: sheet.style.position,
          left: sheet.style.left,
          top: sheet.style.top,
          opacity: sheet.style.opacity,
          zIndex: sheet.style.zIndex,
        };

        sheet.style.position = "fixed";
        sheet.style.left = "0";
        sheet.style.top = "0";
        sheet.style.opacity = "0.01";
        sheet.style.zIndex = "-1";

        openLoading("Gerando PDF...");
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));

        try {
          await html2pdf()
            .set({
              margin: [10, 10, 10, 10],
              filename: "escala-oracao-ininterrupta.pdf",
              image: { type: "jpeg", quality: 0.95 },
              html2canvas: {
                scale: 2,
                useCORS: true,
                scrollX: 0,
                scrollY: 0,
                windowWidth: 794,
              },
              jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
              pagebreak: { mode: ["avoid-all", "css", "legacy"] },
            })
            .from(sheet)
            .save();
        } catch {
          await Swal.fire({
            title: "Erro no PDF",
            text: "Não foi possível gerar o arquivo. Tente de novo ou use a opção Lista WhatsApp.",
            icon: "warning",
            ...buttons(),
          });
        } finally {
          sheet.style.position = saved.position;
          sheet.style.left = saved.left;
          sheet.style.top = saved.top;
          sheet.style.opacity = saved.opacity;
          sheet.style.zIndex = saved.zIndex;
          Swal.close();
        }
      });

      async function main() {
        if (!id) {
          window.location.href = "index.html";
          return;
        }
        try {
          const data = await ICM.getScale(id);
          if (!data) {
            ICM.forget(id);
            await Swal.fire({
              title: "Escala não encontrada",
              html:
                "Este link <strong>não está no servidor</strong> (comum com links antigos ou só do seu celular).<br><br>" +
                "Peça quem administra para criar de novo em <strong>Nova escala</strong> no site e enviar o link do botão <strong>Compartilhar</strong>.",
              icon: "warning",
              confirmButtonText: "Ir para o início",
              ...buttons(),
            });
            window.location.href = "index.html";
            return;
          }
          state = data;
          owner = ICM.isOwner(id);
          render();
          enableActions();
        } catch (err) {
          document.getElementById("slotList").innerHTML =
            '<div class="loading-row">Não foi possível carregar. Tente de novo ou crie uma nova escala no início.</div>';
          Swal.fire({
            title: "Erro",
            text:
              err && err.message === "api_off"
                ? "Sem conexão com o servidor. Os horários são salvos online para todo o grupo — verifique a internet."
                : "Não foi possível carregar a escala. Use o link Compartilhar de uma escala criada no site online.",
            icon: "error",
            ...buttons(),
          });
        }
      }

      main();
    </script>
  </body>
</html>
